<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marxo – Step by Step | Coming Soon</title>
<meta name="description" content="Marxo – Step by Step. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    min-height:100vh;
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 0% 0%, rgba(76,201,240,.55), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(247,37,133,.55), transparent 45%),
      linear-gradient(135deg,#4361EE 0%,#7209B7 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    text-align:center;
  }
  main{width:100%;max-width:560px}
  .welcome{font-weight:600;font-size:1.2rem;letter-spacing:.02em;opacity:.95}
  h1{
    font-weight:800;
    font-size:clamp(4rem,21vw,7.5rem);
    line-height:1;
    letter-spacing:-.02em;
    color:#FFD60A;
    text-shadow:0 5px 0 rgba(20,0,60,.35);
    margin-bottom:6px;
  }
  svg{display:block;width:100%;height:auto;margin:0 auto}
  .soon{
    display:inline-block;
    margin-top:14px;
    font-weight:800;
    font-size:1.1rem;
    color:#7209B7;
    background:#fff;
    border-radius:999px;
    padding:8px 26px;
    box-shadow:0 5px 0 rgba(20,0,60,.3);
  }

  .step{transform-box:fill-box;transform-origin:bottom;animation:rise .5s ease-out both}
  .s1{animation-delay:.05s}.s2{animation-delay:.15s}.s3{animation-delay:.25s}
  .s4{animation-delay:.35s}.s5{animation-delay:.45s}
  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}

  .student{animation:climb 12s linear infinite}
  @keyframes climb{
    0%,4%   {transform:translate(12px,200px);opacity:1}
    12%     {transform:translate(60px,166px)}
    15%     {transform:translate(60px,166px)}
    23%     {transform:translate(120px,142px)}
    26%     {transform:translate(120px,142px)}
    34%     {transform:translate(180px,118px)}
    37%     {transform:translate(180px,118px)}
    45%     {transform:translate(240px,94px)}
    48%     {transform:translate(240px,94px)}
    56%     {transform:translate(300px,70px);opacity:1}
    93%     {transform:translate(300px,70px);opacity:1}
    97%     {transform:translate(300px,70px);opacity:0}
    97.01%  {transform:translate(12px,200px);opacity:0}
    100%    {transform:translate(12px,200px);opacity:1}
  }
  .hop{animation:hop 12s linear infinite}
  @keyframes hop{
    0%,64%{transform:translateY(0)}
    68%{transform:translateY(-6px)}
    72%{transform:translateY(0)}
    76%{transform:translateY(-6px)}
    80%,100%{transform:translateY(0)}
  }
  .cap{animation:cap 12s linear infinite}
  @keyframes cap{
    0%,57%{opacity:0;transform:translateY(-22px)}
    63%,93%{opacity:1;transform:translateY(0)}
    97%,100%{opacity:0;transform:translateY(0)}
  }
  .raised{animation:raised 12s linear infinite}
  @keyframes raised{
    0%,64%{opacity:0}
    66%,93%{opacity:1}
    97%,100%{opacity:0}
  }
  .lowered{animation:lowered 12s linear infinite}
  @keyframes lowered{
    0%,64%{opacity:1}
    66%,97%{opacity:0}
    97.01%,100%{opacity:1}
  }

  @media (prefers-reduced-motion:reduce){
    .step,.hop,.cap,.raised,.lowered{animation:none}
    .student{animation:none;transform:translate(300px,70px)}
    .cap,.raised{opacity:1}
    .lowered{opacity:0}
  }
</style>
</head>
<body>
<main>
  <p class="welcome">Welcome to</p>
  <h1>Marxo</h1>

  <svg viewBox="0 0 340 250" role="img" aria-label="A student with a school bag climbs five colourful steps and receives a cap and a degree at the top">
    <!-- ground -->
    <rect x="0" y="200" width="340" height="4" rx="2" fill="rgba(255,255,255,.45)"/>

    <!-- colourful stairs -->
    <rect class="step s1" x="30"  y="166" width="60" height="34"  rx="4" fill="#FF4D6D"/>
    <rect class="step s2" x="90"  y="142" width="60" height="58"  rx="4" fill="#FF9F1C"/>
    <rect class="step s3" x="150" y="118" width="60" height="82"  rx="4" fill="#FFD60A"/>
    <rect class="step s4" x="210" y="94"  width="60" height="106" rx="4" fill="#3DDC84"/>
    <rect class="step s5" x="270" y="70"  width="60" height="130" rx="4" fill="#4CC9F0"/>

    <!-- Step by Step across the full length of the stairs -->
    <text x="30" y="236" textLength="300" lengthAdjust="spacingAndGlyphs"
          font-family="Poppins, system-ui, sans-serif" font-weight="800" font-size="32"
          fill="#fff">Step by Step</text>

    <!-- student: feet at (0,0) -->
    <g class="student">
      <g class="hop">
        <!-- legs -->
        <rect x="-5" y="-14" width="4.5" height="14" rx="2" fill="#1B1464"/>
        <rect x="1"  y="-14" width="4.5" height="14" rx="2" fill="#1B1464"/>
        <!-- school bag on the back -->
        <rect x="-14" y="-30" width="9" height="17" rx="3.5" fill="#FF3D00"/>
        <rect x="-12.5" y="-26" width="6" height="4" rx="1.5" fill="#FFB199"/>
        <!-- body -->
        <rect x="-7" y="-31" width="14" height="18" rx="3.5" fill="#fff"/>
        <line x1="-6" y1="-29" x2="-6" y2="-15" stroke="#FF3D00" stroke-width="2"/>
        <!-- head -->
        <circle cx="0" cy="-38" r="7" fill="#F1C27D"/>
        <path d="M-7.2 -39 a7.2 7.2 0 0 1 14.4 0 q-7 -4 -14.4 0z" fill="#2B1B17"/>
        <circle cx="3" cy="-37.5" r="1" fill="#2B1B17"/>
        <!-- arm down -->
        <g class="lowered">
          <line x1="5" y1="-28" x2="10" y2="-19" stroke="#F1C27D" stroke-width="3.6" stroke-linecap="round"/>
        </g>
        <!-- arm raised holding degree -->
        <g class="raised">
          <line x1="5" y1="-28" x2="13" y2="-42" stroke="#F1C27D" stroke-width="3.6" stroke-linecap="round"/>
          <g transform="translate(13 -44) rotate(-35)">
            <rect x="-9" y="-3.5" width="18" height="7" rx="3.5" fill="#FFF4D6" stroke="#E0B84C" stroke-width="1"/>
            <rect x="-1.5" y="-3.5" width="3" height="7" fill="#D62839"/>
          </g>
        </g>
        <!-- graduation cap -->
        <g class="cap">
          <g transform="translate(0 -44)">
            <rect x="-6" y="0" width="12" height="5" rx="1.5" fill="#111"/>
            <polygon points="-12,0 0,-5.5 12,0 0,5.5" fill="#1d1d1d"/>
            <line x1="10" y1="0.5" x2="10" y2="8" stroke="#FFD60A" stroke-width="1.4"/>
            <circle cx="10" cy="9" r="1.6" fill="#FFD60A"/>
          </g>
        </g>
      </g>
    </g>
  </svg>

  <span class="soon">Coming Soon</span>
</main>
</body>
</html>
