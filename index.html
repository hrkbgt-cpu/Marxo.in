<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marxo – Step by Step | Coming Soon</title>
<meta name="description" content="Marxo – Step by Step. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    min-height:100vh;
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 0% 0%, rgba(76,201,240,.55), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(247,37,133,.55), transparent 45%),
      linear-gradient(135deg,#4361EE 0%,#7209B7 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    text-align:center;
    overflow-x:hidden;
  }
  main{width:100%;max-width:560px}
  .welcome{font-weight:600;font-size:1.2rem;letter-spacing:.02em;opacity:.95}
  h1{
    position:relative;
    display:table;                     /* shrink-wraps the word so the golden rule is exactly as long as MARXO */
    margin:0 auto 22px;
    padding:0 .4em;                    /* the golden rule is wider than the word, so MARXO sits inside it */
    font-weight:800;
    font-size:clamp(3.2rem,16vw,6.5rem);
    line-height:.9;
    letter-spacing:-.01em;
    color:#FFD60A;
    text-shadow:0 5px 0 rgba(20,0,60,.35);
  }
  /* golden rule under MARXO: thin at both ends, bright in the middle, flashes once */
  h1::after{
    content:"";
    position:absolute;left:0;right:0;bottom:calc(-.05em - 3px);height:3px;border-radius:3px;
    background:linear-gradient(90deg,rgba(255,214,10,0) 0%,#FFB400 14%,#FFD60A 38%,#FFF3A6 50%,#FFD60A 62%,#FFB400 86%,rgba(255,214,10,0) 100%);
    -webkit-clip-path:polygon(0 50%,12% 0,88% 0,100% 50%,88% 100%,12% 100%);
    clip-path:polygon(0 50%,12% 0,88% 0,100% 50%,88% 100%,12% 100%);
    transform-origin:50% 50%;
    animation:ruleFlash 1.4s ease-out .5s both;
  }
  @keyframes ruleFlash{
    0%{opacity:0;transform:scaleX(.05)}
    35%{opacity:1;transform:scaleX(1);filter:brightness(2.4) drop-shadow(0 0 10px rgba(255,235,120,1))}
    100%{opacity:1;transform:scaleX(1);filter:brightness(1) drop-shadow(0 0 3px rgba(255,214,10,.6))}
  }
  .tagline{
    position:relative;
    display:table;
    max-width:100%;
    margin:22px auto 22px;
    font-weight:800;
    font-size:clamp(1.05rem,5.2vw,1.9rem);
    letter-spacing:.03em;
    line-height:1.25;
    text-wrap:balance;
    /* MARXO's golden yellow, with a clearly visible light sweep and glow */
    background:linear-gradient(100deg,#FFB400 0%,#FFD60A 30%,#FFFBD2 50%,#FFD60A 70%,#FFB400 100%);
    background-size:300% 100%;
    background-position:130% 0;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 0 rgba(20,0,60,.35)) drop-shadow(0 0 0 rgba(255,214,10,0));
    animation:tagIn .8s ease-out both, tagShine 2.8s ease-in-out 1s infinite, tagGlow 2.8s ease-in-out 1s infinite;
  }
  /* golden rule under the tagline: exactly as long as the words, tapering to a point at both ends */
  .tagline::after{
    content:"";
    position:absolute;left:calc(var(--ext,0px)*-1);right:calc(var(--ext,0px)*-1);bottom:-12px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,rgba(255,214,10,0) 0%,#FFB400 14%,#FFD60A 38%,#FFF3A6 50%,#FFD60A 62%,#FFB400 86%,rgba(255,214,10,0) 100%);
    -webkit-clip-path:polygon(0 50%,12% 0,88% 0,100% 50%,88% 100%,12% 100%);
    clip-path:polygon(0 50%,12% 0,88% 0,100% 50%,88% 100%,12% 100%);
    transform-origin:50% 50%;
    animation:ruleFlash 1.4s ease-out 1.1s both;
  }
  /* ===== desktop / laptop: scale the whole page to the window height so nothing needs scrolling ===== */
  @media (min-width:900px){
    main{max-width:clamp(340px,calc((100vh - 415px) / .737),720px)}
    h1{font-size:clamp(4.5rem,11vh,7rem)}
    .tagline{font-size:clamp(1.4rem,3.2vh,2.2rem)}
  }
  @keyframes tagIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes tagShine{0%{background-position:130% 0}50%,100%{background-position:-30% 0}}
  @keyframes tagGlow{
    0%,100%{filter:drop-shadow(0 3px 0 rgba(20,0,60,.35)) drop-shadow(0 0 0 rgba(255,214,10,0))}
    25%{filter:drop-shadow(0 3px 0 rgba(20,0,60,.35)) drop-shadow(0 0 14px rgba(255,214,10,.95))}
  }
  svg{display:block;width:100%;height:auto;margin:0 auto;overflow:visible}
  .slot{height:112px;margin-top:10px;display:flex;align-items:flex-start;justify-content:center}
  .soon{
    display:block;
    width:270px;
    max-width:100%;
    font-family:inherit;
    font-weight:800;
    font-size:1.55rem;
    color:#7209B7;
    background:#fff;
    border:0;
    border-radius:999px;
    padding:12px 26px;
    box-shadow:0 5px 0 rgba(20,0,60,.3);
    cursor:pointer;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .08s, box-shadow .08s, width .35s ease, font-size .35s ease, padding .35s ease;
  }
  .soon:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(20,0,60,.3)}
  .soon.gold{
    width:100%;
    font-size:clamp(1.5rem,7.5vw,2.2rem);
    padding:12px 10px;
    cursor:default;
    background-color:#FFC400;
    background-image:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 62%);
    animation:goldBeat 4.8s ease-in-out infinite;  /* 6 pulses x 0.8 s: ring colour and glow change together on every pulse */
  }
  .soon.gold:active{transform:none;box-shadow:0 5px 0 rgba(20,0,60,.3)}
  .cs{
    display:inline-block;
    padding:6px 24px;
    border-radius:999px;
    background:linear-gradient(135deg,#2B0A5C,#5B1FB5);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);
    line-height:1.3;
  }
  .cs-t{
    display:inline-block;
    background:linear-gradient(90deg,#FFE680,#FF8AD8,#7CF2FF,#FFE680);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    animation:csShift 3s linear infinite;
  }
  @keyframes csShift{to{background-position:200% 0}}
  @keyframes goldBeat{
    0.000%{background-color:#FFC400;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,196,0,0.4);filter:brightness(.97)}
    8.333%{background-color:#FFC400;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(255,196,0,0.95);filter:brightness(1.1)}
    14.500%{background-color:#FFC400;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,196,0,0.4);filter:brightness(.97)}
    16.667%{background-color:#FF4FA8;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,79,168,0.4);filter:brightness(.97)}
    25.000%{background-color:#FF4FA8;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(255,79,168,0.95);filter:brightness(1.1)}
    31.167%{background-color:#FF4FA8;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,79,168,0.4);filter:brightness(.97)}
    33.333%{background-color:#14D1F0;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(20,209,240,0.4);filter:brightness(.97)}
    41.667%{background-color:#14D1F0;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(20,209,240,0.95);filter:brightness(1.1)}
    47.833%{background-color:#14D1F0;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(20,209,240,0.4);filter:brightness(.97)}
    50.000%{background-color:#4CE05B;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(76,224,91,0.4);filter:brightness(.97)}
    58.333%{background-color:#4CE05B;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(76,224,91,0.95);filter:brightness(1.1)}
    64.500%{background-color:#4CE05B;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(76,224,91,0.4);filter:brightness(.97)}
    66.667%{background-color:#FF8A1F;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,138,31,0.4);filter:brightness(.97)}
    75.000%{background-color:#FF8A1F;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(255,138,31,0.95);filter:brightness(1.1)}
    81.167%{background-color:#FF8A1F;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,138,31,0.4);filter:brightness(.97)}
    83.333%{background-color:#A66BFF;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(166,107,255,0.4);filter:brightness(.97)}
    91.667%{background-color:#A66BFF;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(166,107,255,0.95);filter:brightness(1.1)}
    97.833%{background-color:#A66BFF;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(166,107,255,0.4);filter:brightness(.97)}
    100%{background-color:#FFC400;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,196,0,0.4);filter:brightness(.97)}
  }
  #rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
  .step{transform-box:fill-box;transform-origin:bottom;animation:rise .45s ease-out both}
  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @media (prefers-reduced-motion:reduce){.tagline{animation:none;background-position:50% 0}h1::after,.tagline::after{animation:none}.step{animation:none}.soon.gold{animation:none;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(255,214,10,.85)}.cs-t{animation:none}.soon{transition:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main>
  <p class="welcome">Welcome to</p>
  <h1>MARXO</h1>
  <p class="tagline">Smaller Steps - Bigger Success</p>

  <svg viewBox="0 -44 350 258" role="img" aria-label="A student with a school bag climbs one colourful stair for every click; at the top he turns to face us, the bag drops away, and he celebrates with a degree in one hand and money in the other">
    <defs>
      <linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#E8B890"/><stop offset="1" stop-color="#D19B72"/>
      </linearGradient>
      <linearGradient id="gShirt" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E0EC"/>
      </linearGradient>
      <linearGradient id="gPants" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2E4075"/><stop offset="1" stop-color="#18224C"/>
      </linearGradient>
      <g id="bagShape">
        <rect x="-4.8" y="-9" width="9.6" height="18" rx="3.6" fill="#B3261E"/>
        <rect x="-3.6" y="0.4" width="7.2" height="6.2" rx="2" fill="#8E1D17"/>
        <line x1="-4.8" y1="-3.4" x2="4.8" y2="-3.4" stroke="#7A1812" stroke-width=".7"/>
        <rect x="-2.2" y="-10.6" width="4.4" height="2.6" rx="1.3" fill="#7A1812"/>
      </g>
    </defs>

    <!-- ground -->
    <rect x="0" y="200" width="340" height="4" rx="2" fill="rgba(255,255,255,.45)"/>

    <!-- 5 colours x 2 low steps each = 10 steps (rise 9 each) -->
    <g id="stairs"></g>

    <!-- ===== side view (climbing, facing the stairs) ===== -->
    <g id="side">
      <!-- far arm -->
      <line id="faU" stroke="#D3D8E3" stroke-width="4.8" stroke-linecap="round"/>
      <line id="faF" stroke="#C99A73" stroke-width="3.6" stroke-linecap="round"/>
      <circle id="faH" r="2" fill="#C99A73"/>
      <!-- far leg -->
      <line id="flT" stroke="#18224C" stroke-width="7.2" stroke-linecap="round"/>
      <line id="flS" stroke="#18224C" stroke-width="5.8" stroke-linecap="round"/>
      <g id="flShoe"><path d="M-3.4 -3.8 L4.6 -3.8 Q8.6 -3.6 8.6 -0.8 L8.6 0 L-3.4 0 Z" fill="#111"/></g>
      <!-- school bag -->
      <use id="bagA" href="#bagShape"/>
      <!-- neck sits behind the shirt; the collar covers its base -->
      <line id="neck" stroke="#D9A57C" stroke-width="3.6" stroke-linecap="round"/>
      <!-- torso -->
      <line id="tsO" stroke="#C3CAD8" stroke-width="12.4" stroke-linecap="round"/>
      <line id="ts" stroke="url(#gShirt)" stroke-width="11" stroke-linecap="round"/>
      <line id="colO" stroke="#C3CAD8" stroke-width="3.6" stroke-linecap="round"/>
      <line id="col" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
      <!-- shirt tucked into trousers, belt with buckle -->
      <g id="waist">
        <rect x="-5.7" y="-2.6" width="11.4" height="6" rx="2.4" fill="#243263"/>
        <rect x="-5.9" y="-3.8" width="11.8" height="2.4" fill="#121A3E"/>
        <rect x="3.1" y="-3.6" width="2.4" height="2" rx=".4" fill="#D8C486"/>
      </g>
      <!-- near leg -->
      <line id="nlT" stroke="url(#gPants)" stroke-width="7.4" stroke-linecap="round"/>
      <line id="nlS" stroke="url(#gPants)" stroke-width="6" stroke-linecap="round"/>
      <g id="nlShoe"><path d="M-3.4 -3.8 L4.6 -3.8 Q8.6 -3.6 8.6 -0.8 L8.6 0 L-3.4 0 Z" fill="#1c1c1c"/><rect x="-3.4" y="-0.9" width="12" height=".9" fill="#e6e6e6"/></g>
      <!-- near arm -->
      <line id="naU" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <line id="naF" stroke="#E0AC82" stroke-width="3.7" stroke-linecap="round"/>
      <circle id="naH" r="2.1" fill="#E0AC82"/>
      <!-- head -->
      <g id="hd">
        <ellipse cx="-1.8" cy="-2.2" rx="5.4" ry="5.4" fill="#1F1410"/>
        <path d="M-2.4 -4.4 C0.6 -5.2 3.8 -4.4 4.8 -2.4 C5.1 -1.3 5 -0.6 5.2 0.4 C5.5 0.9 5.9 1.5 5.7 1.9 C5.5 2.2 5.2 2.2 5.1 2.5 C5.2 3.2 5.1 3.8 4.7 4.3 C4.3 5.8 2.2 6.6 -0.2 6.3 C-2.4 5.9 -3.8 3.6 -3.9 0.6 C-3.9 -1.8 -3.3 -3.4 -2.4 -4.4 Z" fill="url(#gSkin)"/>
        <ellipse cx="-3.4" cy="1.2" rx="1.3" ry="1.9" fill="#D9A57C" stroke="#BE8A63" stroke-width=".4"/>
        <path d="M-3.6 .3 q.9 .4 .3 1.9" fill="none" stroke="#BE8A63" stroke-width=".35" stroke-linecap="round"/>
        <path d="M-7.1 -0.5 C-7.6 -6.6 -2.4 -8.4 1.6 -7.8 C4.7 -7.4 6.4 -5.4 5.7 -3 C5.3 -3.6 4.9 -4 4.6 -4.2 C3 -4.8 1.6 -4.2 0.4 -3.6 C-0.8 -3.2 -1.8 -3.8 -2.6 -3.2 L-3.4 -3.4 C-4.6 -3 -5 -1 -5.2 0.6 Z" fill="#1F1410"/>
        <path d="M-2.3 -3.5 C-1.4 -3.3 -0.9 -1.4 -1 0.3 C-1 1.5 -1.2 2.5 -1.5 3.1 C-1.9 3.2 -2.3 3 -2.5 2.7 C-2.2 1.2 -2.3 -1.2 -2.3 -3.5 Z" fill="#1F1410"/>
        <path d="M2.3 -2.4 Q3.5 -3 4.6 -2.4" fill="none" stroke="#1F1410" stroke-width=".6" stroke-linecap="round"/>
        <ellipse cx="3.2" cy="-0.7" rx=".8" ry=".95" fill="#2a1a14"/>
        <circle cx="3.45" cy="-1" r=".25" fill="#fff"/>
        <path d="M5.2 .7 q.6 .8 -.1 1.3" fill="none" stroke="#BE8A63" stroke-width=".45" stroke-linecap="round"/>
        <path d="M3.4 3.7 q1 .55 1.8 0" fill="none" stroke="#8A4B3A" stroke-width=".55" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ===== front view (celebrating) ===== -->
    <g id="front" style="display:none">
      <ellipse cx="0" cy="0.4" rx="11" ry="2.2" fill="rgba(20,0,60,.28)"/>
      <!-- legs and shoes -->
      <line x1="-3.3" y1="-24" x2="-3.7" y2="-3.5" stroke="url(#gPants)" stroke-width="5.8" stroke-linecap="round"/>
      <line x1="3.3" y1="-24" x2="3.7" y2="-3.5" stroke="url(#gPants)" stroke-width="5.8" stroke-linecap="round"/>
      <ellipse cx="-4.4" cy="-1.6" rx="3.5" ry="1.9" fill="#1c1c1c"/>
      <ellipse cx="4.4" cy="-1.6" rx="3.5" ry="1.9" fill="#1c1c1c"/>
      <!-- arms (below the torso layer so sleeves tuck in) -->
      <line id="fLU" stroke="#FFFFFF" stroke-width="4.6" stroke-linecap="round"/>
      <line id="fLF" stroke="#E0AC82" stroke-width="3.5" stroke-linecap="round"/>
      <circle id="fLH" r="2.1" fill="#E0AC82"/>
      <line id="fRU" stroke="#FFFFFF" stroke-width="4.6" stroke-linecap="round"/>
      <line id="fRF" stroke="#E0AC82" stroke-width="3.5" stroke-linecap="round"/>
      <circle id="fRH" r="2.1" fill="#E0AC82"/>
      <!-- torso -->
      <rect x="-6.9" y="-24.6" width="13.8" height="2.6" rx="1" fill="#17224A"/>
      <rect x="-1.4" y="-24.5" width="2.8" height="2.4" rx=".4" fill="#D8C486"/>
      <path d="M-7.6 -36.6 Q-7.7 -38.7 -5 -38.8 L5 -38.8 Q7.7 -38.7 7.6 -36.6 L6.9 -24 L-6.9 -24 Z" fill="url(#gShirt)" stroke="#C3CAD8" stroke-width=".4"/>
      <polygon points="-2.8,-38.8 0,-35.6 2.8,-38.8" fill="#EEF1F7" stroke="#C3CAD8" stroke-width=".4"/>
      <polygon points="-1,-36 1,-36 1.7,-28.5 0,-26.4 -1.7,-28.5" fill="#C0392B"/>
      <!-- neck, head -->
      <rect x="-1.9" y="-41.4" width="3.8" height="3.4" fill="#D9A57C"/>
      <ellipse cx="-5.1" cy="-46" rx="1.2" ry="1.7" fill="#C99A73"/>
      <ellipse cx="5.1" cy="-46" rx="1.2" ry="1.7" fill="#C99A73"/>
      <ellipse cx="0" cy="-46.2" rx="5.2" ry="5.9" fill="url(#gSkin)"/>
      <path d="M-5.5 -47 Q-5.8 -53.4 0 -53.2 Q5.8 -53.4 5.5 -47 Q3.2 -50.4 0 -50.2 Q-3.2 -50.4 -5.5 -47 Z" fill="#1F1410"/>
      <path d="M-5.5 -48.2 L-4 -48.4 L-4.2 -44.8 Q-4.9 -44.4 -5.3 -45 Z" fill="#1F1410"/>
      <path d="M5.5 -48.2 L4 -48.4 L4.2 -44.8 Q4.9 -44.4 5.3 -45 Z" fill="#1F1410"/>
      <circle cx="-2" cy="-46.4" r=".7" fill="#2a1a14"/>
      <circle cx="2" cy="-46.4" r=".7" fill="#2a1a14"/>
      <line x1="-3.1" y1="-48" x2="-1" y2="-48.3" stroke="#1F1410" stroke-width=".6" stroke-linecap="round"/>
      <line x1="1" y1="-48.3" x2="3.1" y2="-48" stroke="#1F1410" stroke-width=".6" stroke-linecap="round"/>
      <path d="M0 -46 q-.7 1.6 .2 2" fill="none" stroke="#BE8A63" stroke-width=".5" stroke-linecap="round"/>
      <path d="M-2.2 -43 Q0 -41.2 2.2 -43" fill="none" stroke="#8A4B3A" stroke-width=".7" stroke-linecap="round"/>
      <!-- graduation cap -->
      <g id="cap">
        <path d="M-5.7 -53 L-5.7 -50.4 Q0 -48.4 5.7 -50.4 L5.7 -53 Z" fill="#222"/>
        <polygon points="-11,-53.4 0,-57.4 11,-53.4 0,-49.6" fill="#141414"/>
        <line x1="9" y1="-53.4" x2="9" y2="-46.6" stroke="#FFD60A" stroke-width=".9"/>
        <circle cx="9" cy="-45.8" r="1.2" fill="#FFD60A"/>
      </g>
      <!-- degree (right hand) -->
      <g id="degree">
        <rect x="-7.5" y="-2.3" width="15" height="4.6" rx="2.3" fill="#FFF4D6" stroke="#E0B84C" stroke-width=".7"/>
        <rect x="-1.4" y="-2.3" width="2.8" height="4.6" fill="#D62839"/>
        <circle cx="-7.2" cy="0" r="1.9" fill="#F3E3B3" stroke="#E0B84C" stroke-width=".5"/>
        <circle cx="7.2" cy="0" r="1.9" fill="#F3E3B3" stroke="#E0B84C" stroke-width=".5"/>
      </g>
      <!-- money (left hand) -->
      <g id="money">
        <rect x="-7" y="-3.6" width="14" height="8" rx="1.2" fill="#1E7A3C"/>
        <rect x="-7" y="-4.8" width="14" height="8" rx="1.2" fill="#2E9E4F" stroke="#1E7A3C" stroke-width=".6"/>
