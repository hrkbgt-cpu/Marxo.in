<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marxo – Step by Step | Coming Soon</title>
<meta name="description" content="Marxo – Step by Step. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    min-height:100vh;
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 0% 0%, rgba(76,201,240,.55), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(247,37,133,.55), transparent 45%),
      linear-gradient(135deg,#4361EE 0%,#7209B7 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
    text-align:center;
    overflow-x:hidden;
  }
  main{width:100%;max-width:600px}
  .welcome{font-weight:600;font-size:1.2rem;letter-spacing:.02em;opacity:.95}
  h1{
    font-weight:800;
    font-size:clamp(4rem,21vw,7.5rem);
    line-height:1;
    letter-spacing:-.02em;
    color:#FFD60A;
    text-shadow:0 5px 0 rgba(20,0,60,.35);
    margin-bottom:2px;
  }
  #stage{position:relative;width:100%;height:440px}
  #c{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
  #c:active{cursor:grabbing}
  #fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;
    padding:20px;font-weight:600;line-height:1.5}
  .soon{
    display:inline-block;
    margin-top:6px;
    font-weight:800;
    font-size:1.1rem;
    color:#7209B7;
    background:#fff;
    border-radius:999px;
    padding:8px 26px;
    box-shadow:0 5px 0 rgba(20,0,60,.3);
  }
  #fb2d{display:none;width:100%;max-width:560px;margin:0 auto}
  #fb2d svg{display:block;width:100%;height:auto;margin:0 auto;overflow:visible}
  .step{transform-box:fill-box;transform-origin:bottom;animation:rise .45s ease-out both}
  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @media (prefers-reduced-motion:reduce){.step{animation:none}}
</style>
</head>
<body>
<main>
  <p class="welcome">Welcome to</p>
  <h1>Marxo</h1>
  <div id="stage">
    <canvas id="c" aria-label="3D scene: a student walks up colourful stairs, turns to face you, drops his school bag and raises a degree and money"></canvas>
  </div>
  <div id="fb2d"><svg viewBox="0 0 340 250" role="img" aria-label="A student with a school bag walks up the colourful stairs step by step; at the top he turns to face us, the bag drops away, and he raises a degree in one hand and money in the other">
    <defs>
      <linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#E8B890"/><stop offset="1" stop-color="#D19B72"/>
      </linearGradient>
      <linearGradient id="gShirt" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E0EC"/>
      </linearGradient>
      <linearGradient id="gPants" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2E4075"/><stop offset="1" stop-color="#18224C"/>
      </linearGradient>
      <g id="bagShape">
        <rect x="-4.8" y="-9" width="9.6" height="18" rx="3.6" fill="#B3261E"/>
        <rect x="-3.6" y="0.4" width="7.2" height="6.2" rx="2" fill="#8E1D17"/>
        <line x1="-4.8" y1="-3.4" x2="4.8" y2="-3.4" stroke="#7A1812" stroke-width=".7"/>
        <rect x="-2.2" y="-10.6" width="4.4" height="2.6" rx="1.3" fill="#7A1812"/>
      </g>
    </defs>

    <!-- ground -->
    <rect x="0" y="200" width="340" height="4" rx="2" fill="rgba(255,255,255,.45)"/>

    <!-- 5 colours x 2 low steps each = 10 steps (rise 9 each) -->
    <g id="stairs"></g>

    <!-- Step by Step across the full length of the stairs -->
    <text x="30" y="236" textLength="300" lengthAdjust="spacingAndGlyphs"
          font-family="Poppins, system-ui, sans-serif" font-weight="800" font-size="32"
          fill="#fff">Step by Step</text>

    <!-- ===== side view (climbing, facing the stairs) ===== -->
    <g id="side">
      <!-- far arm -->
      <line id="faU" stroke="#D3D8E3" stroke-width="4.8" stroke-linecap="round"/>
      <line id="faF" stroke="#C99A73" stroke-width="3.6" stroke-linecap="round"/>
      <circle id="faH" r="2" fill="#C99A73"/>
      <!-- far leg -->
      <line id="flT" stroke="#18224C" stroke-width="7.2" stroke-linecap="round"/>
      <line id="flS" stroke="#18224C" stroke-width="5.8" stroke-linecap="round"/>
      <g id="flShoe"><path d="M-3.4 -3.8 L4.6 -3.8 Q8.6 -3.6 8.6 -0.8 L8.6 0 L-3.4 0 Z" fill="#111"/></g>
      <!-- school bag -->
      <use id="bagA" href="#bagShape"/>
      <!-- hips, torso -->
      <circle id="hipC" r="5.8" fill="#243263"/>
      <line id="tsO" stroke="#C3CAD8" stroke-width="12.4" stroke-linecap="round"/>
      <line id="ts" stroke="url(#gShirt)" stroke-width="11" stroke-linecap="round"/>
      <!-- near leg -->
      <line id="nlT" stroke="url(#gPants)" stroke-width="7.4" stroke-linecap="round"/>
      <line id="nlS" stroke="url(#gPants)" stroke-width="6" stroke-linecap="round"/>
      <g id="nlShoe"><path d="M-3.4 -3.8 L4.6 -3.8 Q8.6 -3.6 8.6 -0.8 L8.6 0 L-3.4 0 Z" fill="#1c1c1c"/><rect x="-3.4" y="-0.9" width="12" height=".9" fill="#e6e6e6"/></g>
      <!-- near arm -->
      <line id="naU" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <line id="naF" stroke="#E0AC82" stroke-width="3.7" stroke-linecap="round"/>
      <circle id="naH" r="2.1" fill="#E0AC82"/>
      <!-- neck and head -->
      <line id="neck" stroke="#D9A57C" stroke-width="3.8" stroke-linecap="round"/>
      <circle id="hHair" r="6.6" fill="#1F1410"/>
      <ellipse id="hFace" rx="5.4" ry="6.1" fill="url(#gSkin)"/>
      <circle id="hEar" r="1.5" fill="#C99A73"/>
      <circle id="hEye" r=".75" fill="#2a1a14"/>
      <path id="hNose" d="M0 0 q1.7 1 0 2.2" fill="#D9A57C" stroke="#BE8A63" stroke-width=".5"/>
      <path id="hMouth" d="M0 0 q1.4 .5 2.4 -.2" fill="none" stroke="#8A4B3A" stroke-width=".6" stroke-linecap="round"/>
    </g>

    <!-- ===== front view (celebrating) ===== -->
    <g id="front" style="display:none">
      <ellipse cx="0" cy="0.4" rx="11" ry="2.2" fill="rgba(20,0,60,.28)"/>
      <!-- legs and shoes -->
      <line x1="-3.3" y1="-24" x2="-3.7" y2="-3.5" stroke="url(#gPants)" stroke-width="5.8" stroke-linecap="round"/>
      <line x1="3.3" y1="-24" x2="3.7" y2="-3.5" stroke="url(#gPants)" stroke-width="5.8" stroke-linecap="round"/>
      <ellipse cx="-4.4" cy="-1.6" rx="3.5" ry="1.9" fill="#1c1c1c"/>
      <ellipse cx="4.4" cy="-1.6" rx="3.5" ry="1.9" fill="#1c1c1c"/>
      <!-- arms (below the torso layer so sleeves tuck in) -->
      <line id="fLU" stroke="#FFFFFF" stroke-width="4.6" stroke-linecap="round"/>
      <line id="fLF" stroke="#E0AC82" stroke-width="3.5" stroke-linecap="round"/>
      <circle id="fLH" r="2.1" fill="#E0AC82"/>
      <line id="fRU" stroke="#FFFFFF" stroke-width="4.6" stroke-linecap="round"/>
      <line id="fRF" stroke="#E0AC82" stroke-width="3.5" stroke-linecap="round"/>
      <circle id="fRH" r="2.1" fill="#E0AC82"/>
      <!-- torso -->
      <rect x="-6.9" y="-24.6" width="13.8" height="2.6" rx="1" fill="#17224A"/>
      <path d="M-7.6 -36.6 Q-7.7 -38.7 -5 -38.8 L5 -38.8 Q7.7 -38.7 7.6 -36.6 L6.9 -24 L-6.9 -24 Z" fill="url(#gShirt)" stroke="#C3CAD8" stroke-width=".4"/>
      <polygon points="-2.8,-38.8 0,-35.6 2.8,-38.8" fill="#EEF1F7" stroke="#C3CAD8" stroke-width=".4"/>
      <polygon points="-1,-36 1,-36 1.7,-28.5 0,-26.4 -1.7,-28.5" fill="#C0392B"/>
      <!-- neck, head -->
      <rect x="-1.9" y="-41.4" width="3.8" height="3.4" fill="#D9A57C"/>
      <ellipse cx="-5.1" cy="-46" rx="1.2" ry="1.7" fill="#C99A73"/>
      <ellipse cx="5.1" cy="-46" rx="1.2" ry="1.7" fill="#C99A73"/>
      <ellipse cx="0" cy="-46.2" rx="5.2" ry="5.9" fill="url(#gSkin)"/>
      <path d="M-5.5 -47 Q-5.8 -53.4 0 -53.2 Q5.8 -53.4 5.5 -47 Q3.2 -50.4 0 -50.2 Q-3.2 -50.4 -5.5 -47 Z" fill="#1F1410"/>
      <circle cx="-2" cy="-46.4" r=".7" fill="#2a1a14"/>
      <circle cx="2" cy="-46.4" r=".7" fill="#2a1a14"/>
      <line x1="-3.1" y1="-48" x2="-1" y2="-48.3" stroke="#1F1410" stroke-width=".6" stroke-linecap="round"/>
      <line x1="1" y1="-48.3" x2="3.1" y2="-48" stroke="#1F1410" stroke-width=".6" stroke-linecap="round"/>
      <path d="M0 -46 q-.7 1.6 .2 2" fill="none" stroke="#BE8A63" stroke-width=".5" stroke-linecap="round"/>
      <path d="M-2.2 -43 Q0 -41.2 2.2 -43" fill="none" stroke="#8A4B3A" stroke-width=".7" stroke-linecap="round"/>
      <!-- graduation cap -->
      <g id="cap">
        <path d="M-5.7 -53 L-5.7 -50.4 Q0 -48.4 5.7 -50.4 L5.7 -53 Z" fill="#222"/>
        <polygon points="-11,-53.4 0,-57.4 11,-53.4 0,-49.6" fill="#141414"/>
        <line x1="9" y1="-53.4" x2="9" y2="-46.6" stroke="#FFD60A" stroke-width=".9"/>
        <circle cx="9" cy="-45.8" r="1.2" fill="#FFD60A"/>
      </g>
      <!-- degree (right hand) -->
      <g id="degree">
        <rect x="-7.5" y="-2.3" width="15" height="4.6" rx="2.3" fill="#FFF4D6" stroke="#E0B84C" stroke-width=".7"/>
        <rect x="-1.4" y="-2.3" width="2.8" height="4.6" fill="#D62839"/>
        <circle cx="-7.2" cy="0" r="1.9" fill="#F3E3B3" stroke="#E0B84C" stroke-width=".5"/>
        <circle cx="7.2" cy="0" r="1.9" fill="#F3E3B3" stroke="#E0B84C" stroke-width=".5"/>
      </g>
      <!-- money (left hand) -->
      <g id="money">
        <rect x="-7" y="-3.6" width="14" height="8" rx="1.2" fill="#1E7A3C"/>
        <rect x="-7" y="-4.8" width="14" height="8" rx="1.2" fill="#2E9E4F" stroke="#1E7A3C" stroke-width=".6"/>
        <rect x="-1.4" y="-4.8" width="2.8" height="8" fill="#FFD60A"/>
        <text x="-5.4" y="0.6" font-size="4.6" font-weight="800" fill="#fff" font-family="Poppins, system-ui, sans-serif">₹</text>
        <text x="2.4" y="0.6" font-size="4.6" font-weight="800" fill="#fff" font-family="Poppins, system-ui, sans-serif">₹</text>
      </g>
    </g>

    <!-- bag that drops away at the top -->
    <use id="bagFall" href="#bagShape" style="display:none"/>
  </svg></div>
  <span class="soon">Coming Soon</span>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.__start3D = function(){
  var $ = function(id){ return document.getElementById(id); };
  function showFallback(){ if (window.__fallback) window.__fallback(); }
  if (typeof THREE === 'undefined'){ showFallback(); return; }

  var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
  var lerp  = function(a,b,t){ return a + (b-a)*t; };
  var sm    = function(t){ t = clamp(t,0,1); return t*t*(3-2*t); };
  /* gentle ease: half linear + half smoothstep, so motion never fully stops between steps */
  var soft  = function(t){ t = clamp(t,0,1); return 0.5*t + 0.5*t*t*(3-2*t); };
  var easeOutBack = function(t){ t = clamp(t,0,1); var c1 = 1.5, c3 = c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };

  var stage = $('stage'), canvas = $('c');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch (e){ showFallback(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(30, 1.4, 10, 4000);

  /* ---------------- helpers ---------------- */
  function M(color, rough){
    return new THREE.MeshStandardMaterial({ color: color, roughness: rough == null ? 0.75 : rough, metalness: 0 });
  }
  function cyl(rt, rb, h, mat, seg){
    var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 18), mat);
    m.castShadow = true; return m;
  }
  function sph(r, mat, sx, sy, sz){
    var m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mat);
    m.scale.set(sx || 1, sy || 1, sz || 1); m.castShadow = true; return m;
  }
  function box(w, h, d, mat){
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.castShadow = true; return m;
  }

  /* ---------------- lights ---------------- */
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a6bff, 0.8));
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(110, 300, 260);
  sun.target.position.set(180, 40, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -240; sun.shadow.camera.right = 240;
  sun.shadow.camera.top = 220;   sun.shadow.camera.bottom = -140;
  sun.shadow.camera.near = 50;   sun.shadow.camera.far = 900;
  sun.shadow.bias = -0.0006;
  scene.add(sun); scene.add(sun.target);
  /* soft cyan rim light from behind gives the figure a polished edge */
  var rim = new THREE.DirectionalLight(0x9fe8ff, 0.45);
  rim.position.set(300, 160, -240);
  rim.target.position.set(180, 60, 0);
  scene.add(rim); scene.add(rim.target);

  /* ---------------- floor ---------------- */
  var slab = new THREE.Mesh(new THREE.BoxGeometry(330, 3, 138),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.16, depthWrite: false }));
  slab.position.set(180, -1.5, 39);
  scene.add(slab);
  var shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(700, 400),
    new THREE.ShadowMaterial({ opacity: 0.28 }));
  shadowPlane.rotation.x = -Math.PI/2; shadowPlane.position.set(180, 0.05, 40);
  shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);

  /* ---------------- stairs: 5 colours x 2 low steps ---------------- */
  var colours = [0xFF4D6D, 0xFF9F1C, 0xFFD60A, 0x3DDC84, 0x4CC9F0];
  var stairMeshes = [];
  var edgeMat = new THREE.LineBasicMaterial({ color: 0x14003c, transparent: true, opacity: 0.28 });
  for (var k = 1; k <= 10; k++){
    var g = new THREE.BoxGeometry(30, 9*k, 46);
    g.translate(0, 4.5*k, 0);
    var st = new THREE.Mesh(g, M(colours[Math.ceil(k/2)-1], 0.55));
    st.position.set(30 + 30*(k-1) + 15, 0, 0);
    st.castShadow = true; st.receiveShadow = true;
    st.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat));
    scene.add(st);
    stairMeshes.push(st);
  }

  /* ---------------- "Step by Step" painted along the full length ---------------- */
  var signCanvas = document.createElement('canvas');
  var SIGN_W = 2048, SIGN_D = 72, SIGN_H = Math.round(SIGN_W * SIGN_D / 300);
  signCanvas.width = SIGN_W; signCanvas.height = SIGN_H;
  var signTex = new THREE.CanvasTexture(signCanvas);
  signTex.anisotropy = 8;
  function drawSign(){
    var cx = signCanvas.getContext('2d');
    cx.clearRect(0, 0, SIGN_W, SIGN_H);
    cx.font = '800 280px Poppins, "Segoe UI", Arial, sans-serif';
    var w = cx.measureText('Step by Step').width || 1800;
    cx.save();
    cx.translate(SIGN_W/2, SIGN_H/2);
    cx.scale((SIGN_W - 50)/w, 1.3);
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillStyle = '#ffffff';
    cx.fillText('Step by Step', 0, 8);
    cx.restore();
    signTex.needsUpdate = true;
  }
  drawSign();
  if (document.fonts && document.fonts.load){
    document.fonts.load('800 100px Poppins').then(drawSign, drawSign);
  }
  var sign = new THREE.Mesh(new THREE.PlaneGeometry(300, SIGN_D),
    new THREE.MeshBasicMaterial({ map: signTex, transparent: true, depthWrite: false }));
  sign.rotation.x = -Math.PI/2; sign.position.set(180, 0.3, 30 + SIGN_D/2);
  scene.add(sign);

  /* ---------------- the student ---------------- */
  var L1 = 16, L2 = 16, ANK = 3.6, HH = 34.6, UA = 10.6, UF = 10;
  var skin = M(0xE0AC82, .8), skinD = M(0xC99A73, .8), shirt = M(0xffffff, .8), pants = M(0x22305f, .85),
      shoeM = M(0x161616, .6), soleM = M(0xe8e8e8, .7), hairM = M(0x1F1410, .9), eyeM = M(0x20120d, .5),
      tieM = M(0xC0392B, .7), goldM = M(0xFFD60A, .4), capM = M(0x141414, .7),
      paperM = M(0xFFF4D6, .8), ribbonM = M(0xD62839, .6), bandM = M(0xFFD60A, .5);
  var bagRed = M(0xB3261E, .7), bagDark = M(0x7A1812, .7);
  var bodyMats = [skin, skinD, shirt, pants, shoeM, soleM, hairM, eyeM, tieM, goldM, capM, paperM, ribbonM, bandM];
  var bagMats = [bagRed, bagDark];

  var rig = new THREE.Group(); scene.add(rig);

  var pelvis = sph(5.6, pants, 0.9, 0.85, 1.25); rig.add(pelvis);

  function makeLeg(zOff){
    var th = new THREE.Group(); th.position.set(0, 0, zOff); rig.add(th);
    var t = cyl(3.7, 3.0, L1, pants); t.position.y = -L1/2; th.add(t);
    var kn = sph(3.05, pants); kn.position.y = -L1; th.add(kn);
    var sh = new THREE.Group(); sh.position.y = -L1; th.add(sh);
    var s = cyl(2.9, 2.3, L2, pants); s.position.y = -L2/2; sh.add(s);
    var an = sph(2.3, pants); an.position.y = -L2; sh.add(an);
    var ft = new THREE.Group(); ft.position.y = -L2; sh.add(ft);
    var shoe = box(11, 3.0, 5.2, shoeM); shoe.position.set(2.6, -1.9, 0); ft.add(shoe);
    var toe = sph(2.6, shoeM, 1, .6, 1); toe.position.set(7.6, -1.9, 0); ft.add(toe);
    var sole = box(11.4, 0.7, 5.4, soleM); sole.position.set(2.7, -3.25, 0); ft.add(sole);
    return { th: th, sh: sh, ft: ft };
  }
  var legA = makeLeg(3.8), legB = makeLeg(-3.8);

  var torso = new THREE.Group(); rig.add(torso);
  var tMesh = cyl(7.0, 6.4, 16, shirt, 24); tMesh.scale.set(0.64, 1, 1); tMesh.position.y = 8.6; torso.add(tMesh);
  var belt = cyl(6.55, 6.55, 1.8, pants, 24); belt.scale.set(0.67, 1, 1.0); belt.position.y = 1.4; torso.add(belt);
  var tie = box(0.6, 8, 2.1, tieM); tie.position.set(4.55, 10, 0); torso.add(tie);
  [-1, 1].forEach(function(s){
    var sp = box(0.8, 14.5, 2, bagDark); sp.position.set(4.6, 9.4, s*4.5); torso.add(sp);
    var sp2 = box(9.6, 0.8, 2, bagDark); sp2.position.set(0, 16.3, s*4.5); torso.add(sp2);
    var sj = sph(3.1, shirt); sj.position.set(0, 14.6, s*7.3); torso.add(sj);
  });
  var neck = cyl(2.0, 2.2, 3.4, skinD); neck.position.y = 17.6; torso.add(neck);

  var head = new THREE.Group(); head.position.y = 23.8; torso.add(head);
  head.add(sph(6.2, skin, 0.95, 1.1, 0.9));
  var hair = new THREE.Mesh(new THREE.SphereGeometry(6.6, 20, 14, 0, Math.PI*2, 0, Math.PI*0.56), hairM);
  hair.scale.set(0.98, 1.12, 0.94); hair.position.set(-0.4, 0.3, 0); hair.rotation.z = 0.42; hair.castShadow = true;
  head.add(hair);
  var eyes = [];
  [-1, 1].forEach(function(s){
    var eye = sph(0.78, eyeM); eye.position.set(5.45, 0.9, s*2.2); head.add(eye); eyes.push(eye);
    var brow = box(0.5, 0.55, 2.4, hairM); brow.position.set(5.3, 2.5, s*2.2); head.add(brow);
    var ear = sph(1.4, skinD); ear.position.set(-0.6, -0.2, s*5.7); head.add(ear);
  });
  var nose = sph(1.15, skinD); nose.position.set(6.1, -0.8, 0); head.add(nose);
  var mouth = box(0.4, 0.5, 2.8, M(0x8A4B3A, .6)); mouth.position.set(5.2, -3.1, 0); head.add(mouth);

  /* graduation cap (hidden until the top) */
  var capG = new THREE.Group(); head.add(capG);
  var skull = cyl(5.3, 5.5, 3.4, capM); skull.position.y = 5.6; capG.add(skull);
  var board = box(15.5, 0.9, 15.5, capM); board.position.y = 7.6; board.rotation.y = Math.PI/4; capG.add(board);

    line($('tsO'), Hx+up.x*1.5, Hy+up.y*1.5, Sx, Sy);
    line($('ts'),  Hx+up.x*1.5, Hy+up.y*1.5, Sx, Sy);
    var Nx = Sx + up.x*NECK, Ny = Sy + up.y*NECK;
    line($('neck'), Sx,Sy, Nx,Ny);
    var Cx = Nx + up.x*5.2 + 1.4, Cy = Ny + up.y*5.2 - 0.2;
    $('hHair').setAttribute('cx', Cx-1.0); $('hHair').setAttribute('cy', Cy-0.9);
    $('hFace').setAttribute('cx', Cx+0.9); $('hFace').setAttribute('cy', Cy+0.6);
    $('hEar').setAttribute('cx', Cx-1.4);  $('hEar').setAttribute('cy', Cy+0.8);
    $('hEye').setAttribute('cx', Cx+3.6);  $('hEye').setAttribute('cy', Cy-0.6);
    $('hNose').setAttribute('transform','translate('+(Cx+5.9)+' '+(Cy-0.2)+')');
    $('hMouth').setAttribute('transform','translate('+(Cx+3.2)+' '+(Cy+3.4)+')');

    /* arms swing opposite to the legs */
    var phase = clamp((A.x - B.x)/15, -1.3, 1.3);
    var thN = -0.5*phase, thF = 0.5*phase;
    var aN = armPose(Sx,Sy, thN, 0.2 + 0.35*Math.max(0,thN));
    var aF = armPose(Sx,Sy, thF, 0.2 + 0.35*Math.max(0,thF));
    line($('naU'), Sx,Sy, aN.ex,aN.ey); line($('naF'), aN.ex,aN.ey, aN.hx,aN.hy);
    $('naH').setAttribute('cx',aN.hx); $('naH').setAttribute('cy',aN.hy);
    line($('faU'), Sx,Sy, aF.ex,aF.ey); line($('faF'), aF.ex,aF.ey, aF.hx,aF.hy);
    $('faH').setAttribute('cx',aF.hx); $('faH').setAttribute('cy',aF.hy);

    /* school bag on the back (bounces slightly with each step) */
    var bx = Hx + up.x*8.8 + back.x*7.6, by = Hy + up.y*8.8 + back.y*7.6 + 0.5*Math.sin(2*Math.PI*u);
    var rot = lean*180/Math.PI;
    bagA.setAttribute('transform','translate('+bx+' '+by+') rotate('+rot+')');
    return { x:bx, y:by, rot:rot };
  }

  /* ---------- front view: celebration ---------- */
  function frontPose(c){
    var k = easeOutBack((c-0.4)/0.5);
    var kc = sm((c-0.4)/0.5);
    var wob = c > 1.0 ? 1.1*Math.sin(c*7) : 0;
    var sides = [['L',-1],['R',1]];
    for (var q = 0; q < 2; q++){
      var id = sides[q][0], s = sides[q][1];
      var shx = s*7.2, shy = -37;
      var elx = lerp(s*8.8, s*12.8, k), ely = lerp(-28.5, -46.5, k);
      var hnx = lerp(s*9.4, s*14.8, k), hny = lerp(-20, -56.5, k) + (s>0 ? wob : -wob)*kc;
      line($('f'+id+'U'), shx,shy, elx,ely);
      line($('f'+id+'F'), elx,ely, hnx,hny);
      $('f'+id+'H').setAttribute('cx',hnx); $('f'+id+'H').setAttribute('cy',hny);
      var item = (id === 'R') ? $('degree') : $('money');
      var rotI = (id === 'R') ? -24 : 20;
      var sc = clamp(kc*2.5, 0, 1);
      item.setAttribute('transform','translate('+hnx+' '+(hny-2.6)+') rotate('+rotI+') scale('+sc+')');
    }
    var capOff = 0, capOp = 0;
    if (c >= 0.7){
      capOp = 1;
      var p = (c-0.7)/0.4;
      capOff = p < 1 ? -26*(1 - sm(p)) : 0;
    }
    $('cap').setAttribute('transform','translate(0 '+capOff+')');
    $('cap').setAttribute('opacity', capOp);
    var hop = 0;
    if (c >= 1.2 && c < 1.6) hop = -7*Math.sin(Math.PI*(c-1.2)/0.4);
    if (c >= 1.8 && c < 2.2) hop = -7*Math.sin(Math.PI*(c-1.8)/0.4);
    return hop;
  }

  /* ---------- main render ---------- */
  function render(t){
    var fig = 1;
    if (t < 0.3) fig = t/0.3;
    if (t > TCLIMB + HOLD) fig = clamp(1 - (t - TCLIMB - HOLD)/0.5, 0, 1);

    if (t < TCLIMB){
      sidePose(t);
      side.style.display = '';
      side.removeAttribute('transform');
      side.setAttribute('opacity', fig);
      bagA.style.display = '';
      front.style.display = 'none';
      bagFall.style.display = 'none';
      return;
    }

    var c = (t - TCLIMB) * CSPEED;
    var b = sidePose(TCLIMB);            /* final climbing pose */

    /* bag falls off and fades */
    var g = 180, vx = -22, vy = -10, LAND = 113;
    var tl = (-vy + Math.sqrt(vy*vy - 2*g*(b.y - LAND)))/g;
    var tc = Math.min(c, tl);
    var px = b.x + vx*tc, py = b.y + vy*tc + 0.5*g*tc*tc, pr = b.rot + 160*tc;
    var bo = 1 - clamp((c - tl - 0.3)/0.4, 0, 1);
    bagFall.style.display = bo > 0 ? '' : 'none';
    bagFall.setAttribute('transform','translate('+px+' '+py+') rotate('+pr+')');
    bagFall.setAttribute('opacity', bo * fig);
    bagA.style.display = 'none';

    /* turn from side to front */
    if (c < 0.25){
      var sx = 1 - sm(c/0.25);
      side.style.display = '';
      side.setAttribute('transform','translate('+CX+' 0) scale('+Math.max(sx,0.02)+' 1) translate('+(-CX)+' 0)');
      side.setAttribute('opacity', fig);
    } else {
      side.style.display = 'none';
    }

    var hop = frontPose(c);
    if (c >= 0.15){
      var fx = sm((c-0.15)/0.3);
      front.style.display = '';
      front.setAttribute('transform','translate('+CX+' '+(TOP_Y + hop)+') scale('+(SC*Math.max(fx,0.02))+' '+SC+')');
      front.setAttribute('opacity', fig);
    } else {
      front.style.display = 'none';
    }
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){
    render(TCLIMB + 3.0);
  } else {
    var t0 = performance.now();
    (function loop(now){
      render(((now - t0)/1000) % LOOP);
      requestAnimationFrame(loop);
    })(t0);
  }
};
</script>
<script>
(function(){
  function fb(){
    if (window.__fbDone) return; window.__fbDone = true;
    var st = document.getElementById('stage'); if (st) st.style.display = 'none';
    var f = document.getElementById('fb2d'); if (f) f.style.display = 'block';
    if (window.__start2D) window.__start2D();
  }
  window.__fallback = fb;
  function go(){
    if (!window.THREE) return fb();
    try { window.__start3D(); } catch (e){ fb(); }
  }
  if (window.THREE) return go();
  /* first CDN failed: try a second one, then fall back to the 2D animation */
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  s.onload = go; s.onerror = fb;
  document.head.appendChild(s);
  setTimeout(function(){ if (!window.THREE) fb(); }, 6000);
})();
</script>

</body>
