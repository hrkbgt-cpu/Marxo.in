<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marxo – Stepwise Learning Systems | Coming Soon</title>
<meta name="description" content="Marxo – Stepwise Learning Systems. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    min-height:100vh;min-height:100dvh;
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#fff;
    /* same deep-navy night sky as the Marxo NEET app splash */
    background-color:#0A1030;
    background-image:
      radial-gradient(ellipse 75% 45% at 50% 22%, rgba(30,48,120,.85) 0%, rgba(22,35,90,.55) 35%, rgba(13,21,51,0) 70%),
      linear-gradient(180deg,#0E1638 0%,#0B1233 45%,#070B24 100%);
    background-attachment:fixed;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;                  /* everything fits on one screen, centred vertically */
    padding:clamp(10px,2.6vh,36px) 16px clamp(8px,1.6vh,20px);
    text-align:center;
    overflow-x:hidden;
  }
  :root{--btn:270px}
  main{width:100%;max-width:560px;position:relative;z-index:1}
  #stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .welcome{font-weight:500;font-size:clamp(.78rem,min(4vw,2.3vh),1.05rem);letter-spacing:.22em;text-transform:uppercase;color:#AEB8DA;margin-bottom:clamp(0px,.6vh,6px)}
  h1{
    position:relative;
    display:table;
    margin:0 auto 0;
    padding:0 0 0 .16em;               /* balances the letter-spacing after the last letter */
    font-family:'Noto Serif',Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:clamp(2.6rem,min(19vw,12vh),8rem);
    line-height:1;
    letter-spacing:.16em;
    /* gold like the app: lighter at the top, deeper at the bottom */
    background:linear-gradient(180deg,#F6DC8C 0%,#E2BC5E 50%,#C79A3C 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.35)) drop-shadow(0 0 18px rgba(226,188,94,.18));
  }
  /* hairline gold rule like the app: wider than the word, fading out at both ends */
  .rule{
    display:block;
    width:min(92%,30rem);
    height:1px;
    margin:clamp(4px,1.1vh,10px) auto clamp(6px,1.5vh,14px);
    background:linear-gradient(90deg,rgba(201,162,74,0) 0%,rgba(201,162,74,.55) 20%,#F0D58A 50%,rgba(201,162,74,.55) 80%,rgba(201,162,74,0) 100%);
    transform-origin:50% 50%;
    animation:ruleFlash 1.4s ease-out .4s both;
  }
  @keyframes ruleFlash{
    0%{opacity:0;transform:scaleX(.05)}
    35%{opacity:1;transform:scaleX(1);filter:brightness(1.8) drop-shadow(0 0 6px rgba(240,213,138,.9))}
    100%{opacity:1;transform:scaleX(1);filter:none}
  }
  .tagline{
    display:table;                 /* shrink-wraps the words so the script can size them */
    white-space:nowrap;
    margin:-.15em auto clamp(6px,1.4vh,14px);
    padding-left:.2em;             /* balances the trailing letter-spacing */
    font-family:'Poppins',system-ui,sans-serif;
    font-weight:500;
    font-size:clamp(.72rem,min(3.6vw,2.1vh),1.05rem);
    letter-spacing:.2em;
    text-transform:uppercase;
    line-height:1.4;
    /* MARXO gold */
    background:linear-gradient(180deg,#F6DC8C 0%,#E2BC5E 55%,#C79A3C 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    font-weight:600;
    animation:tagIn .8s ease-out .6s both;
  }
  @keyframes tagIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  svg{display:block;width:100%;height:auto;margin:0 auto;overflow:visible}
  .slot{height:clamp(62px,10vh,86px);margin-top:clamp(2px,.8vh,8px);display:flex;align-items:flex-start;justify-content:center}
  .soon{
    display:block;
    width:var(--btn);
    max-width:100%;
    font-family:inherit;
    font-weight:800;
    font-size:clamp(1.15rem,3.2vh,1.55rem);
    color:#0B1233;                       /* same deep navy as the page background */
    background:linear-gradient(180deg,#F6DC8C 0%,#E2BC5E 55%,#C79A3C 100%);   /* MARXO gold */
    border:0;
    border-radius:999px;
    padding:12px 26px;
    box-shadow:0 5px 0 rgba(20,0,60,.3);
    cursor:pointer;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .08s, box-shadow .08s, width .35s ease, font-size .35s ease, padding .35s ease;
  }
  .soon:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(20,0,60,.3)}
  .soon.gold{
    width:100%;
    font-size:clamp(1.25rem,min(7.5vw,4.4vh),2.2rem);
    padding:clamp(8px,1.4vh,12px) 10px;
    cursor:default;
    background-color:#FFC400;
    background-image:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 62%);
    animation:goldBeat 4.8s ease-in-out infinite;  /* 6 pulses x 0.8 s: ring colour and glow change together on every pulse */
  }
  .soon.gold:active{transform:none;box-shadow:0 5px 0 rgba(20,0,60,.3)}
  .cs{
    display:inline-block;
    padding:6px 24px;
    border-radius:999px;
    background:linear-gradient(135deg,#0B1233,#22337A);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);
    line-height:1.3;
  }
  .cs-t{
    display:inline-block;
    background:linear-gradient(90deg,#FFE680,#FF8AD8,#7CF2FF,#FFE680);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    animation:csShift 3s linear infinite;
  }
  @keyframes csShift{to{background-position:200% 0}}
  @keyframes goldBeat{
    0.000%{background-color:#FFC400;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,196,0,0.4);filter:brightness(.97)}
    8.333%{background-color:#FFC400;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(255,196,0,0.95);filter:brightness(1.1)}
    14.500%{background-color:#FFC400;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,196,0,0.4);filter:brightness(.97)}
    16.667%{background-color:#FF4FA8;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,79,168,0.4);filter:brightness(.97)}
    25.000%{background-color:#FF4FA8;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(255,79,168,0.95);filter:brightness(1.1)}
    31.167%{background-color:#FF4FA8;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,79,168,0.4);filter:brightness(.97)}
    33.333%{background-color:#14D1F0;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(20,209,240,0.4);filter:brightness(.97)}
    41.667%{background-color:#14D1F0;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(20,209,240,0.95);filter:brightness(1.1)}
    47.833%{background-color:#14D1F0;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(20,209,240,0.4);filter:brightness(.97)}
    50.000%{background-color:#4CE05B;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(76,224,91,0.4);filter:brightness(.97)}
    58.333%{background-color:#4CE05B;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(76,224,91,0.95);filter:brightness(1.1)}
    64.500%{background-color:#4CE05B;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(76,224,91,0.4);filter:brightness(.97)}
    66.667%{background-color:#FF8A1F;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,138,31,0.4);filter:brightness(.97)}
    75.000%{background-color:#FF8A1F;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(255,138,31,0.95);filter:brightness(1.1)}
    81.167%{background-color:#FF8A1F;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,138,31,0.4);filter:brightness(.97)}
    83.333%{background-color:#A66BFF;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(166,107,255,0.4);filter:brightness(.97)}
    91.667%{background-color:#A66BFF;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(166,107,255,0.95);filter:brightness(1.1)}
    97.833%{background-color:#A66BFF;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(166,107,255,0.4);filter:brightness(.97)}
    100%{background-color:#FFC400;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 6px 1px rgba(255,196,0,0.4);filter:brightness(.97)}
  }
  #side,#front{filter:drop-shadow(0 0 .6px rgba(255,255,255,.95)) drop-shadow(0 0 2.2px rgba(170,190,255,.45))}
  /* ™ sits just after the O, without pushing MARXO off-centre */
  .tm{
    position:absolute;left:calc(100% - .42em);top:.32em;
    font-family:'Poppins',system-ui,sans-serif;font-weight:600;
    font-size:.42em;letter-spacing:0;line-height:1;
    color:#E2BC5E;-webkit-text-fill-color:#E2BC5E;
  }
  /* ===== info section below the button ===== */
  .info{position:relative;z-index:1;width:100%;max-width:560px;margin-top:0;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.5vh,14px)}
  .links{
    /* two equal buttons; together they stick out equally on both sides of the 270px "Click to Climb" button */
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    width:min(calc(var(--btn) + 60px),100%);white-space:nowrap}
  .exams-label{font-size:.72rem;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#8E99C2}
  .exams{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:calc(clamp(6px,1.5vh,14px) * -.5)}
  .exams span{
    font-family:'Noto Serif',Georgia,serif;font-weight:700;font-size:clamp(.85rem,2.2vh,1.05rem);letter-spacing:.12em;
    color:#F0D58A;padding:clamp(3px,.8vh,6px) 16px;border-radius:999px;
    border:1px solid rgba(226,188,94,.55);background:rgba(226,188,94,.07);
  }
  .wa,.mail{
    display:flex;align-items:center;justify-content:center;gap:7px;
    min-width:0;
    padding:clamp(5px,1vh,8px) 6px;border-radius:999px;
    color:#0B1233;text-decoration:none;            /* deep navy, same as the page */
    font-weight:700;font-size:clamp(.82rem,3.7vw,.98rem);
    box-shadow:0 4px 0 rgba(0,0,0,.3);
    -webkit-tap-highlight-color:transparent;
  }
  .wa{background:#1FA855}
  /* Google-style four-colour gradient */
  .mail{
    background:linear-gradient(110deg,#4285F4 0%,#4285F4 18%,#EA4335 42%,#F2A900 66%,#34A853 88%,#34A853 100%);
  }
  .wa:active,.mail:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .wa svg,.mail svg{width:clamp(24px,7vw,30px);height:clamp(24px,7vw,30px);flex:none;margin:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .foot{margin-top:clamp(0px,.8vh,10px);font-size:.75rem;letter-spacing:.08em;color:#6F7AA3}
  .foot::before{content:"";display:block;width:180px;height:1px;margin:0 auto clamp(4px,1vh,10px);
    background:linear-gradient(90deg,rgba(201,162,74,0),rgba(201,162,74,.5),rgba(201,162,74,0))}
  /* ===== desktop / laptop: bigger stage and buttons, hover feedback ===== */
  @media (min-width:900px){
    :root{--btn:330px}
    main,.info{max-width:780px}
    .soon{font-size:clamp(1.3rem,3.4vh,1.8rem)}
    .soon.gold{font-size:clamp(1.5rem,4.6vh,2.4rem)}
    .wa,.mail{font-size:clamp(1rem,2.4vh,1.2rem)}
    .wa svg,.mail svg{width:clamp(26px,3.6vh,32px);height:clamp(26px,3.6vh,32px)}
    .tagline{font-size:clamp(.9rem,2vh,1.2rem)}
  }
  @media (hover:hover){
    .soon:not(.gold):hover{filter:brightness(1.07);box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 18px rgba(226,188,94,.45)}
    .wa:hover,.mail:hover{filter:brightness(1.1)}
  }
  .soon:focus-visible,.wa:focus-visible,.mail:focus-visible{outline:2px solid #F0D58A;outline-offset:3px}
  #rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
  .step{transform-box:fill-box;transform-origin:bottom;animation:rise .45s ease-out both}
  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @media (prefers-reduced-motion:reduce){.tagline{animation:none}.rule{animation:none}.step{animation:none}.soon.gold{animation:none;box-shadow:0 5px 0 rgba(20,0,60,.3),0 0 24px 8px rgba(255,214,10,.85)}.cs-t{animation:none}.soon{transition:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="rain" aria-hidden="true"></canvas>
<main>
  <p class="welcome">Welcome to</p>
  <h1>MARXO<sup class="tm" aria-label="trademark">™</sup></h1>
  <p class="tagline">Stepwise Learning Systems</p>

  <svg viewBox="0 -44 350 258" role="img" aria-label="A student with a school bag climbs one colourful stair for every click; at the top he turns to face us, the bag drops away, and he celebrates with a degree in one hand and money in the other">
    <defs>
      <linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#E8B890"/><stop offset="1" stop-color="#D19B72"/>
      </linearGradient>
      <linearGradient id="gShirt" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E0EC"/>
      </linearGradient>
      <linearGradient id="gPants" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8C96AE"/><stop offset="1" stop-color="#646E87"/>
      </linearGradient>
      <g id="bagShape">
        <rect x="-4.8" y="-9" width="9.6" height="18" rx="3.6" fill="#B3261E"/>
        <rect x="-3.6" y="0.4" width="7.2" height="6.2" rx="2" fill="#8E1D17"/>
        <line x1="-4.8" y1="-3.4" x2="4.8" y2="-3.4" stroke="#7A1812" stroke-width=".7"/>
        <rect x="-2.2" y="-10.6" width="4.4" height="2.6" rx="1.3" fill="#7A1812"/>
      </g>
    </defs>

    <!-- ground -->
    <rect x="0" y="200" width="340" height="4" rx="2" fill="rgba(255,255,255,.45)"/>

    <!-- 5 colours x 2 low steps each = 10 steps (rise 9 each) -->
    <g id="stairs"></g>

    <!-- ===== side view (climbing, facing the stairs) ===== -->
    <g id="side">
      <!-- far arm -->
      <line id="faU" stroke="#D3D8E3" stroke-width="4.8" stroke-linecap="round"/>
      <line id="faF" stroke="#C99A73" stroke-width="3.6" stroke-linecap="round"/>
      <circle id="faH" r="2" fill="#C99A73"/>
      <!-- far leg -->
      <line id="flT" stroke="#565F77" stroke-width="7.2" stroke-linecap="round"/>
      <line id="flS" stroke="#565F77" stroke-width="5.8" stroke-linecap="round"/>
      <g id="flShoe"><path d="M-3.4 -3.8 L4.6 -3.8 Q8.6 -3.6 8.6 -0.8 L8.6 0 L-3.4 0 Z" fill="#111"/></g>
      <!-- school bag -->
      <use id="bagA" href="#bagShape"/>
      <!-- neck sits behind the shirt; the collar covers its base -->
      <line id="neck" stroke="#D9A57C" stroke-width="3.6" stroke-linecap="round"/>
      <!-- torso -->
      <g id="torso">
        <path d="M-5.6 1.2 L5.4 1.2 L5.9 -8.5 Q6.6 -13.4 4.6 -16.2 Q2.6 -17.6 -0.4 -17.6 L-3.6 -17.4 Q-6.9 -16.6 -6.9 -12.6 Z" fill="url(#gShirt)" stroke="#C3CAD8" stroke-width=".5"/>
        <path d="M1.2 -16.4 L1.6 -2" stroke="#D3D9E5" stroke-width=".5" fill="none"/>
        <circle cx="1.9" cy="-12" r=".45" fill="#B9C1D0"/>
        <circle cx="2.0" cy="-8" r=".45" fill="#B9C1D0"/>
        <circle cx="2.1" cy="-4" r=".45" fill="#B9C1D0"/>
        <!-- collar -->
        <path d="M-2.6 -18.4 L1.8 -18.6 L3.6 -15.6 L0.6 -16.8 Z" fill="#FFFFFF" stroke="#BCC4D3" stroke-width=".45" stroke-linejoin="round"/>
        <path d="M-3.4 -18 L-1.4 -18.5 L-0.6 -16.2 Z" fill="#EEF1F6" stroke="#BCC4D3" stroke-width=".4" stroke-linejoin="round"/>
      </g>
      <!-- backpack strap over the shoulder -->
      <polyline id="strap" fill="none" stroke="#7A1812" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- shirt tucked into trousers, belt with buckle -->
      <g id="waist">
        <rect x="-5.7" y="-2.6" width="11.4" height="6" rx="2.4" fill="#7A849C"/>
        <rect x="-5.9" y="-3.8" width="11.8" height="2.4" fill="#2A2F3D"/>
        <rect x="3.1" y="-3.6" width="2.4" height="2" rx=".4" fill="#D8C486"/>
      </g>
      <!-- near leg -->
      <line id="nlT" stroke="url(#gPants)" stroke-width="7.4" stroke-linecap="round"/>
      <line id="nlS" stroke="url(#gPants)" stroke-width="6" stroke-linecap="round"/>
      <g id="nlShoe"><path d="M-3.4 -3.8 L4.6 -3.8 Q8.6 -3.6 8.6 -0.8 L8.6 0 L-3.4 0 Z" fill="#1c1c1c"/><rect x="-3.4" y="-0.9" width="12" height=".9" fill="#e6e6e6"/></g>
      <!-- near arm -->
      <line id="naU" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <line id="naF" stroke="#E0AC82" stroke-width="3.7" stroke-linecap="round"/>
      <circle id="naH" r="2.1" fill="#E0AC82"/>
      <!-- head -->
      <g id="hd">
        <circle cx="-0.8" cy="-0.6" r="6.1" fill="#3A2216"/>
        <path d="M-1 -5.4 C2.4 -6.4 5.5 -4.6 5.8 -1.6 L6 -0.4 L7.1 1.2 Q7.2 1.7 6.1 1.8 C6.2 2.7 6 3.4 5.5 4 C4.7 5.6 2.7 6.5 0.4 6.3 C-2.4 6.1 -4.3 4.1 -4.4 1.2 C-4.6 -2 -3.6 -4.6 -1 -5.4 Z" fill="url(#gSkin)"/>
        <path d="M-6.5 1.4 C-7.5 -5 -3.6 -8.1 0.9 -7.7 C4.6 -7.4 6.8 -5.4 6.3 -2.5 C5.3 -3.8 3.5 -4.4 1.7 -3.8 C0.6 -3.4 -0.6 -3.6 -1.7 -2.8 C-2.7 -1.8 -3.1 -0.2 -3.3 1.5 C-3.6 3 -4.4 3.9 -5.2 3.8 C-5.9 3.3 -6.3 2.4 -6.5 1.4 Z" fill="#3A2216"/>
        <ellipse cx="-1.5" cy="0.8" rx="1.35" ry="1.95" fill="#D9A57C" stroke="#BE8A63" stroke-width=".4"/>
        <path d="M-1.8 -0.1 q1 .5 .3 2" fill="none" stroke="#BE8A63" stroke-width=".35" stroke-linecap="round"/>
        <path d="M2.6 -2.5 Q3.8 -3.1 5 -2.5" fill="none" stroke="#1F1410" stroke-width=".65" stroke-linecap="round"/>
        <ellipse cx="3.7" cy="-0.8" rx=".8" ry=".95" fill="#2a1a14"/>
        <circle cx="3.95" cy="-1.1" r=".26" fill="#fff"/>
        <path d="M3.4 3.6 q1.1 .7 2 .05" fill="none" stroke="#8A4B3A" stroke-width=".6" stroke-linecap="round"/>
      </g>
      </g>
    </g>

    <!-- ===== front view (celebrating) ===== -->
    <g id="front" style="display:none">
      <ellipse cx="0" cy="0.4" rx="11" ry="2.2" fill="rgba(20,0,60,.28)"/>
      <!-- legs and shoes -->
      <line x1="-3.3" y1="-24" x2="-3.7" y2="-3.5" stroke="url(#gPants)" stroke-width="5.8" stroke-linecap="round"/>
      <line x1="3.3" y1="-24" x2="3.7" y2="-3.5" stroke="url(#gPants)" stroke-width="5.8" stroke-linecap="round"/>
      <ellipse cx="-4.4" cy="-1.6" rx="3.5" ry="1.9" fill="#1c1c1c"/>
      <ellipse cx="4.4" cy="-1.6" rx="3.5" ry="1.9" fill="#1c1c1c"/>
      <!-- arms (below the torso layer so sleeves tuck in) -->
      <line id="fLU" stroke="#FFFFFF" stroke-width="4.6" stroke-linecap="round"/>
      <line id="fLF" stroke="#E0AC82" stroke-width="3.5" stroke-linecap="round"/>
      <circle id="fLH" r="2.1" fill="#E0AC82"/>
      <line id="fRU" stroke="#FFFFFF" stroke-width="4.6" stroke-linecap="round"/>
      <line id="fRF" stroke="#E0AC82" stroke-width="3.5" stroke-linecap="round"/>
      <circle id="fRH" r="2.1" fill="#E0AC82"/>
      <!-- torso -->
